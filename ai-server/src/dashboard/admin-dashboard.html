<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard - Time Tracker Status Report</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#f0f2f5;color:#1a1a2e;min-height:100vh}

    /* ── Navbar ── */
    .navbar{background:linear-gradient(135deg,#0052CC,#0065FF);padding:14px 32px;color:#fff;display:flex;justify-content:space-between;align-items:center}
    .navbar h1{font-size:18px;font-weight:600}
    .nav-actions{display:flex;gap:8px}
    .nav-btn{background:rgba(255,255,255,.18);border:none;color:#fff;padding:7px 16px;border-radius:6px;cursor:pointer;font-size:13px}
    .nav-btn:hover{background:rgba(255,255,255,.3)}

    /* ── Tabs ── */
    .tab-bar{background:#fff;border-bottom:2px solid #e2e8f0;display:flex;gap:0;padding:0 24px;overflow-x:auto}
    .tab-btn{padding:12px 22px;font-size:13px;font-weight:600;border:none;background:none;cursor:pointer;color:#636e72;border-bottom:3px solid transparent;white-space:nowrap;transition:all .15s}
    .tab-btn:hover{color:#0052CC;background:#f8f9fa}
    .tab-btn.active{color:#0052CC;border-bottom-color:#0052CC}

    /* ── Container ── */
    .container{max-width:1260px;margin:0 auto;padding:24px}
    .tab-content{display:none}
    .tab-content.active{display:block}

    /* ── Summary cards ── */
    .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;margin-bottom:28px}
    .card{background:#fff;border-radius:10px;padding:20px;box-shadow:0 1px 4px rgba(0,0,0,.06);text-align:center}
    .card .label{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:#636e72;margin-bottom:6px}
    .card .value{font-size:30px;font-weight:700}
    .c-blue{color:#0052CC} .c-green{color:#2E7D32} .c-orange{color:#E65100} .c-purple{color:#6c5ce7} .c-gray{color:#636e72}

    /* ── Status badge ── */
    .status-line{margin-bottom:20px}
    .status-badge{display:inline-block;background:#E65100;color:#fff;padding:5px 14px;border-radius:4px;font-size:13px;font-weight:600}

    /* ── Section titles ── */
    .section-title{font-size:16px;font-weight:700;margin:28px 0 12px;color:#1a1a2e}
    .section-title:first-child{margin-top:0}
    .sub-section{margin-bottom:28px}

    /* ── Tables ── */
    .tbl-wrap{background:#fff;border-radius:10px;box-shadow:0 1px 4px rgba(0,0,0,.06);overflow:hidden;margin-bottom:22px}
    table{width:100%;border-collapse:collapse}
    th{padding:10px 14px;text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.4px;font-weight:700;color:#fff}
    td{padding:9px 14px;font-size:13px;border-top:1px solid #f1f3f5}
    tr:hover td{background:#f8f9fa}
    .th-blue{background:#2F5496}
    .th-green{background:#548235}
    .th-orange{background:#C55A11}
    .th-dark{background:#1B3A5C}
    .th-gray{background:#4B5563}
    .th-teal{background:#0D7377}

    /* header for sub-sections */
    .team-header{padding:10px 14px;font-size:14px;font-weight:700;color:#fff;text-align:center}

    /* ── Status colors ── */
    .st{display:inline-block;padding:3px 10px;border-radius:4px;font-size:12px;font-weight:600;white-space:nowrap}
    .st-todo{background:#FFF3CD;color:#856404}
    .st-progress{background:#CCE5FF;color:#004085}
    .st-review{background:#FFE0CC;color:#9A3412}
    .st-done{background:#D4EDDA;color:#155724}
    .st-created{background:#D4EDDA;color:#155724}
    .st-pending{background:#FFF3CD;color:#856404}
    .st-failed{background:#F8D7DA;color:#721C24}
    .st-default{background:#E2E8F0;color:#4A5568}
    .st-active{background:#D4EDDA;color:#155724}
    .st-registered{background:#CCE5FF;color:#004085}
    .st-notstarted{background:#F8D7DA;color:#721C24}

    /* ── Priority colors ── */
    .pr{display:inline-block;padding:3px 10px;border-radius:4px;font-size:12px;font-weight:600}
    .pr-high,.pr-highest{background:#F8D7DA;color:#721C24}
    .pr-medium{background:#FFF3CD;color:#856404}
    .pr-low,.pr-lowest{background:#D4EDDA;color:#155724}
    .pr-default{background:#E2E8F0;color:#4A5568}

    /* ── Links ── */
    a.issue-link{color:#0052CC;text-decoration:none;font-weight:600}
    a.issue-link:hover{text-decoration:underline}

    /* ── Loading / error ── */
    .loading{text-align:center;padding:60px;color:#636e72;font-size:15px}
    .error-banner{background:#fee2e2;color:#991b1b;padding:12px 20px;border-radius:8px;margin-bottom:16px}

    /* ── Login ── */
    .login-overlay{position:fixed;inset:0;background:#f0f2f5;display:flex;align-items:center;justify-content:center;z-index:100}
    .login-box{background:#fff;padding:40px;border-radius:16px;box-shadow:0 4px 20px rgba(0,0,0,.1);text-align:center;width:360px;max-width:90vw}
    .login-box h2{margin-bottom:8px;color:#0052CC}
    .login-box p{color:#636e72;font-size:14px;margin-bottom:24px}
    .login-box input{width:100%;padding:10px 14px;border:1px solid #dfe6e9;border-radius:8px;font-size:14px;margin-bottom:16px}
    .login-box button{width:100%;padding:10px;background:#0052CC;color:#fff;border:none;border-radius:8px;font-size:15px;font-weight:600;cursor:pointer}
    .login-box button:hover{background:#0065FF}
    .login-error{color:#d63031;font-size:13px;margin-bottom:12px}

    /* ── Totals row ── */
    .total-row td{font-weight:700;border-top:2px solid #cbd5e0}

    /* ── Filters ── */
    .filters{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:16px;align-items:center}
    .filters label{font-size:12px;font-weight:600;color:#636e72;text-transform:uppercase;letter-spacing:.4px}
    .filters select{padding:6px 10px;border:1px solid #dfe6e9;border-radius:6px;font-size:13px;color:#1a1a2e;background:#fff;min-width:140px}
    .filter-group{display:flex;flex-direction:column;gap:4px}

    @media(max-width:768px){
      .container{padding:14px}
      .cards{grid-template-columns:repeat(2,1fr)}
      .tab-bar{padding:0 10px}
      .tab-btn{padding:10px 14px;font-size:12px}
    }
  </style>
</head>
<body>

<!-- ═══════════ Login ═══════════ -->
<div class="login-overlay" id="login-overlay">
  <div class="login-box">
    <h2>Admin Dashboard</h2>
    <p>Enter the dashboard password to continue</p>
    <div class="login-error" id="login-error"></div>
    <input type="password" id="password-input" placeholder="Password" autocomplete="off">
    <button onclick="doLogin()">Sign In</button>
  </div>
</div>

<!-- ═══════════ Dashboard ═══════════ -->
<nav class="navbar">
  <h1>Time Tracker Application - Status Report</h1>
  <div class="nav-actions">
    <button class="nav-btn" onclick="loadData()">&#8635; Refresh</button>
    <button class="nav-btn" onclick="doLogout()">Logout</button>
  </div>
</nav>

<div class="tab-bar" id="tab-bar">
  <button class="tab-btn active" data-tab="dashboard">Dashboard</button>
  <button class="tab-btn" data-tab="allUsers">All Users</button>
  <button class="tab-btn" data-tab="issueList">Issue List</button>
  <!-- org tabs added dynamically -->
</div>

<div class="container">
  <div id="error-area"></div>
  <div class="loading" id="loading">Loading dashboard...</div>

  <!-- TAB: Dashboard -->
  <div class="tab-content active" id="tab-dashboard"></div>

  <!-- TAB: All Users -->
  <div class="tab-content" id="tab-allUsers"></div>

  <!-- TAB: Issue List -->
  <div class="tab-content" id="tab-issueList"></div>

  <!-- org tab content added dynamically -->
  <div id="org-tabs-container"></div>
</div>

<script>
// ═══════════════════════════════════════════════════════════════
// Auth
// ═══════════════════════════════════════════════════════════════
let sessionToken = sessionStorage.getItem('admin_session_token') || '';

if (sessionToken) {
  document.getElementById('login-overlay').style.display = 'none';
  loadData();
}

document.getElementById('password-input').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });

async function doLogin() {
  const pw = document.getElementById('password-input').value.trim();
  if (!pw) { document.getElementById('login-error').textContent = 'Please enter a password'; return; }
  document.getElementById('login-error').textContent = '';
  try {
    const r = await fetch('/admin-dashboard/api/login', {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ password: pw })
    });
    const j = await r.json();
    if (!j.success) { document.getElementById('login-error').textContent = j.error || 'Login failed'; return; }
    sessionToken = j.token;
    sessionStorage.setItem('admin_session_token', sessionToken);
    document.getElementById('login-overlay').style.display = 'none';
    loadData();
  } catch { document.getElementById('login-error').textContent = 'Connection error'; }
}

function doLogout() {
  sessionStorage.removeItem('admin_session_token');
  sessionToken = '';
  location.reload();
}

// ═══════════════════════════════════════════════════════════════
// Tab switching
// ═══════════════════════════════════════════════════════════════
document.getElementById('tab-bar').addEventListener('click', e => {
  const btn = e.target.closest('.tab-btn');
  if (!btn) return;
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('tab-' + btn.dataset.tab).classList.add('active');
});

// ═══════════════════════════════════════════════════════════════
// Data loading
// ═══════════════════════════════════════════════════════════════
async function loadData() {
  document.getElementById('error-area').innerHTML = '';
  document.getElementById('loading').style.display = 'block';
  try {
    const r = await fetch('/admin-dashboard/api/stats', {
      headers: { 'Authorization': 'Bearer ' + sessionToken }
    });
    if (r.status === 401) {
      sessionStorage.removeItem('admin_session_token'); sessionToken = '';
      document.getElementById('login-overlay').style.display = 'flex';
      document.getElementById('login-error').textContent = 'Session expired. Please log in again.';
      return;
    }
    const j = await r.json();
    if (!j.success) throw new Error(j.error);
    document.getElementById('loading').style.display = 'none';
    render(j);
  } catch (e) {
    document.getElementById('loading').style.display = 'none';
    document.getElementById('error-area').innerHTML = '<div class="error-banner">' + esc(e.message) + '</div>';
  }
}

// ═══════════════════════════════════════════════════════════════
// Rendering
// ═══════════════════════════════════════════════════════════════
function render(data) {
  renderDashboard(data);
  renderAllUsers(data);
  renderIssueList(data);
  renderOrgTabs(data);
}

// ── Dashboard Tab ──
function renderDashboard(data) {
  const s = data.summary;
  const totalPerOrg = data.usersPerOrg.reduce((a, t) => a + t.userCount, 0);

  let html = `
    <div class="status-line"><span class="status-badge">Status: Internal Testing</span></div>
    <div class="cards">
      <div class="card"><div class="label">Total Users</div><div class="value c-blue">${s.totalUsers}</div></div>
      <div class="card"><div class="label">Active Users</div><div class="value c-blue">${s.activeUsers}</div></div>
      <div class="card"><div class="label">Desktop App Users</div><div class="value c-green">${s.desktopAppUsers}</div></div>
      <div class="card"><div class="label">Not Started</div><div class="value c-orange">${s.notStarted}</div></div>
      <div class="card"><div class="label">Organizations</div><div class="value c-purple">${s.totalOrganizations}</div></div>
      <div class="card"><div class="label">Total Tickets</div><div class="value c-gray">${s.totalTickets}</div></div>
    </div>

    <div class="section-title">Users Per Organization</div>
    <div class="tbl-wrap"><table>
      <thead><tr class="th-blue"><th>Organization</th><th>User Count</th></tr></thead>
      <tbody>
        ${data.usersPerOrg.map(t => `<tr><td>${esc(t.org)}</td><td><strong>${t.userCount}</strong></td></tr>`).join('')}
        <tr class="total-row"><td><strong>Total</strong></td><td><strong>${totalPerOrg}</strong></td></tr>
      </tbody>
    </table></div>

    <div class="section-title">Tickets Raised Per Organization</div>
    <div class="tbl-wrap"><table>
      <thead><tr class="th-blue"><th>Organization</th><th>Tickets Raised</th><th>% of Total</th><th>Started</th></tr></thead>
      <tbody>
        ${data.ticketsPerOrg.map(t => `<tr>
          <td>${esc(t.org)}</td>
          <td><strong>${t.ticketsRaised}</strong></td>
          <td>${t.ticketsRaised > 0 ? t.percentOfTotal + '%' : ''}</td>
          <td>${t.started ? formatDate(t.started) : ''}</td>
        </tr>`).join('')}
        <tr class="total-row"><td></td><td><strong>${s.totalTickets}</strong></td><td></td><td></td></tr>
      </tbody>
    </table></div>

    <div class="section-title">Ticket Status Summary</div>
    <div class="tbl-wrap"><table>
      <thead><tr class="th-blue"><th>Status</th><th>Count</th><th>Organization Breakdown</th></tr></thead>
      <tbody>
        ${data.ticketStatusSummary.map(t => `<tr>
          <td>${statusBadge(t.status)}</td>
          <td><strong>${t.count}</strong></td>
          <td>${esc(t.orgBreakdown)}</td>
        </tr>`).join('')}
      </tbody>
    </table></div>
  `;

  document.getElementById('tab-dashboard').innerHTML = html;
}

// ── All Users Tab ──
function renderAllUsers(data) {
  const users = data.allUsers;
  let html = `
    <div class="section-title">All Users - Complete List (${users.length} Users)</div>
    <div class="tbl-wrap"><table>
      <thead><tr class="th-blue"><th>S.No</th><th>Display Name</th><th>Email</th><th>Organization</th><th>Status</th></tr></thead>
      <tbody>
        ${users.map((u, i) => `<tr>
          <td>${i + 1}</td>
          <td>${esc(u.displayName)}</td>
          <td>${esc(u.email)}</td>
          <td>${esc(u.organization)}</td>
          <td>${userStatusBadge(u.status)}</td>
        </tr>`).join('')}
      </tbody>
    </table></div>
  `;
  document.getElementById('tab-allUsers').innerHTML = html;
}

// ── Issue List Tab ──
let allTickets = [];

function renderIssueList(data) {
  allTickets = data.tickets;

  // Extract unique filter values
  const statuses = [...new Set(allTickets.map(t => t.status).filter(s => s && s !== '-'))].sort();
  const priorities = [...new Set(allTickets.map(t => t.priority).filter(p => p && p !== '-'))].sort();
  const orgs = [...new Set(allTickets.map(t => t.organization).filter(o => o && o !== '-'))].sort();

  let html = `
    <div class="section-title">Jira Feedback Tickets</div>
    <div class="filters">
      <div class="filter-group">
        <label>Status</label>
        <select id="filter-status" onchange="applyIssueFilters()">
          <option value="">All</option>
          ${statuses.map(s => `<option value="${esc(s)}">${esc(s)}</option>`).join('')}
        </select>
      </div>
      <div class="filter-group">
        <label>Priority</label>
        <select id="filter-priority" onchange="applyIssueFilters()">
          <option value="">All</option>
          ${priorities.map(p => `<option value="${esc(p)}">${esc(p)}</option>`).join('')}
        </select>
      </div>
      <div class="filter-group">
        <label>Organization</label>
        <select id="filter-org" onchange="applyIssueFilters()">
          <option value="">All</option>
          ${orgs.map(o => `<option value="${esc(o)}">${esc(o)}</option>`).join('')}
        </select>
      </div>
    </div>
    <div id="issue-table-area"></div>
  `;
  document.getElementById('tab-issueList').innerHTML = html;
  applyIssueFilters();
}

function applyIssueFilters() {
  const statusVal = document.getElementById('filter-status').value;
  const priorityVal = document.getElementById('filter-priority').value;
  const orgVal = document.getElementById('filter-org').value;

  let filtered = allTickets;
  if (statusVal) filtered = filtered.filter(t => t.status === statusVal);
  if (priorityVal) filtered = filtered.filter(t => t.priority === priorityVal);
  if (orgVal) filtered = filtered.filter(t => t.organization === orgVal);

  document.getElementById('issue-table-area').innerHTML = `
    <div style="font-size:13px;color:#636e72;margin-bottom:8px">Showing ${filtered.length} of ${allTickets.length} tickets</div>
    <div class="tbl-wrap"><table>
      <thead><tr class="th-dark"><th>S.No</th><th>Issue Key</th><th>Summary</th><th>Submitted By</th><th>Organization</th><th>Status</th><th>Priority</th></tr></thead>
      <tbody>
        ${filtered.map((t, i) => `<tr>
          <td>${i + 1}</td>
          <td>${t.issueUrl ? '<a class="issue-link" href="' + esc(t.issueUrl) + '" target="_blank">' + esc(t.issueKey) + '</a>' : esc(t.issueKey)}</td>
          <td>${esc(t.summary)}</td>
          <td>${esc(t.submittedBy)}</td>
          <td>${esc(t.organization)}</td>
          <td>${statusBadge(t.status)}</td>
          <td>${priorityBadge(t.priority)}</td>
        </tr>`).join('')}
      </tbody>
    </table></div>
  `;
}

// ── Dynamic Org Tabs ──
const orgThClasses = ['th-green','th-orange','th-teal','th-dark','th-blue','th-gray'];

function renderOrgTabs(data) {
  const tabBar = document.getElementById('tab-bar');
  const container = document.getElementById('org-tabs-container');

  // Remove old dynamic tabs
  tabBar.querySelectorAll('.tab-btn[data-dynamic]').forEach(b => b.remove());
  container.innerHTML = '';

  (data.orgTabs || []).forEach((org, idx) => {
    const tabId = 'org_' + org.orgName.replace(/\s+/g, '_');
    const thClass = orgThClasses[idx % orgThClasses.length];

    // Add tab button
    const btn = document.createElement('button');
    btn.className = 'tab-btn';
    btn.dataset.tab = tabId;
    btn.dataset.dynamic = '1';
    btn.textContent = org.orgName + ' Users';
    tabBar.appendChild(btn);

    // Add tab content div
    const div = document.createElement('div');
    div.className = 'tab-content';
    div.id = 'tab-' + tabId;

    div.innerHTML = `
      <div class="section-title">${esc(org.orgName)} - User List (${org.totalUsers} Users)</div>
      <div class="tbl-wrap"><table>
        <thead><tr class="${thClass}"><th>S.No</th><th>Display Name</th><th>Email</th><th>Status</th></tr></thead>
        <tbody>
          ${org.users.map((u, i) => `<tr><td>${i + 1}</td><td>${esc(u.displayName)}</td><td>${esc(u.email)}</td><td>${userStatusBadge(u.status)}</td></tr>`).join('')}
        </tbody>
      </table></div>
    `;

    container.appendChild(div);
  });
}

// ═══════════════════════════════════════════════════════════════
// Helpers
// ═══════════════════════════════════════════════════════════════
function esc(s) {
  if (s == null) return '';
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

function userStatusBadge(status) {
  if (!status) return '<span class="st st-default">-</span>';
  const s = status.toLowerCase();
  if (s === 'active') return '<span class="st st-active">Active</span>';
  if (s === 'registered') return '<span class="st st-registered">Registered</span>';
  if (s === 'not started') return '<span class="st st-notstarted">Not Started</span>';
  return '<span class="st st-default">' + esc(status) + '</span>';
}

function statusBadge(status) {
  if (!status || status === '-') return '<span class="st st-default">-</span>';
  const s = status.toLowerCase();
  let cls = 'st-default';
  if (s === 'to do' || s === 'to do (start)') cls = 'st-todo';
  else if (s === 'in progress' || s === 'processing') cls = 'st-progress';
  else if (s === 'review' || s === 'in review') cls = 'st-review';
  else if (s === 'done' || s === 'created') cls = 'st-done';
  else if (s === 'pending') cls = 'st-pending';
  else if (s === 'failed') cls = 'st-failed';
  return '<span class="st ' + cls + '">' + esc(status) + '</span>';
}

function priorityBadge(priority) {
  if (!priority || priority === '-') return '<span class="pr pr-default">-</span>';
  const p = priority.toLowerCase();
  let cls = 'pr-default';
  if (p === 'high' || p === 'highest') cls = 'pr-high';
  else if (p === 'medium') cls = 'pr-medium';
  else if (p === 'low' || p === 'lowest') cls = 'pr-low';
  return '<span class="pr ' + cls + '">' + esc(priority) + '</span>';
}

function formatDate(ts) {
  if (!ts) return '';
  const d = new Date(ts);
  const day = d.getDate();
  const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const suffix = (day === 1 || day === 21 || day === 31) ? 'st' : (day === 2 || day === 22) ? 'nd' : (day === 3 || day === 23) ? 'rd' : 'th';
  return day + suffix + ' ' + months[d.getMonth()];
}

// Auto-refresh every 30 seconds
setInterval(() => { if (sessionToken) loadData(); }, 30000);
</script>
</body>
</html>
