<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard - MyWorkMate</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f0f2f5; color: #1a1a2e; min-height: 100vh; }
    .navbar { background: linear-gradient(135deg, #0052CC, #0065FF); padding: 16px 32px; color: #fff; display: flex; justify-content: space-between; align-items: center; }
    .navbar h1 { font-size: 20px; font-weight: 600; }
    .navbar .refresh-btn { background: rgba(255,255,255,.2); border: none; color: #fff; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-size: 14px; }
    .navbar .refresh-btn:hover { background: rgba(255,255,255,.3); }
    .container { max-width: 1200px; margin: 0 auto; padding: 28px 24px; }

    /* Summary cards */
    .summary { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-bottom: 32px; }
    .card { background: #fff; border-radius: 12px; padding: 24px; box-shadow: 0 1px 4px rgba(0,0,0,.06); text-align: center; }
    .card .label { font-size: 12px; text-transform: uppercase; letter-spacing: .5px; color: #636e72; margin-bottom: 8px; }
    .card .value { font-size: 32px; font-weight: 700; }
    .card .value.blue { color: #0052CC; }
    .card .value.green { color: #00b894; }
    .card .value.orange { color: #e17055; }
    .card .value.purple { color: #6c5ce7; }

    /* Org sections */
    .org-section { background: #fff; border-radius: 12px; box-shadow: 0 1px 4px rgba(0,0,0,.06); margin-bottom: 20px; overflow: hidden; }
    .org-header { padding: 16px 20px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; border-bottom: 1px solid #f1f3f5; }
    .org-header:hover { background: #f8f9fa; }
    .org-name { font-size: 16px; font-weight: 600; }
    .org-badges { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    .badge { display: inline-block; font-size: 12px; padding: 4px 10px; border-radius: 20px; font-weight: 600; }
    .badge-blue { background: #dbeafe; color: #1e40af; }
    .badge-green { background: #d1fae5; color: #065f46; }
    .badge-orange { background: #ffedd5; color: #9a3412; }
    .badge-gray { background: #f3f4f6; color: #4b5563; }
    .badge-purple { background: #ede9fe; color: #5b21b6; }
    .chevron { font-size: 18px; transition: transform .2s; color: #636e72; }
    .chevron.open { transform: rotate(90deg); }

    /* User table */
    .org-body { display: none; padding: 0; }
    .org-body.open { display: block; }
    table { width: 100%; border-collapse: collapse; }
    th { background: #f8f9fa; padding: 10px 16px; text-align: left; font-size: 12px; text-transform: uppercase; letter-spacing: .5px; color: #636e72; font-weight: 600; }
    td { padding: 10px 16px; border-top: 1px solid #f1f3f5; font-size: 14px; }
    tr:hover td { background: #f8f9fa; }

    /* Status dots */
    .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; }
    .dot-green { background: #00b894; }
    .dot-gray { background: #b2bec3; }
    .dot-orange { background: #e17055; }

    /* Timestamps */
    .time-ago { color: #636e72; font-size: 13px; }

    /* Loading / error */
    .loading { text-align: center; padding: 60px; color: #636e72; font-size: 16px; }
    .error-banner { background: #fee2e2; color: #991b1b; padding: 12px 20px; border-radius: 8px; margin-bottom: 20px; }

    /* Login */
    .login-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: #f0f2f5; display: flex; align-items: center; justify-content: center; z-index: 100; }
    .login-box { background: #fff; padding: 40px; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,.1); text-align: center; width: 360px; max-width: 90vw; }
    .login-box h2 { margin-bottom: 8px; color: #0052CC; }
    .login-box p { color: #636e72; font-size: 14px; margin-bottom: 24px; }
    .login-box input { width: 100%; padding: 10px 14px; border: 1px solid #dfe6e9; border-radius: 8px; font-size: 14px; margin-bottom: 16px; }
    .login-box button { width: 100%; padding: 10px; background: #0052CC; color: #fff; border: none; border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer; }
    .login-box button:hover { background: #0065FF; }
    .login-error { color: #d63031; font-size: 13px; margin-bottom: 12px; }

    @media (max-width: 768px) {
      .container { padding: 16px; }
      .summary { grid-template-columns: repeat(2, 1fr); }
    }
  </style>
</head>
<body>

  <!-- Login -->
  <div class="login-overlay" id="login-overlay">
    <div class="login-box">
      <h2>Admin Dashboard</h2>
      <p>Enter the dashboard password to continue</p>
      <div class="login-error" id="login-error"></div>
      <input type="password" id="password-input" placeholder="Password" autocomplete="off">
      <button onclick="doLogin()">Sign In</button>
    </div>
  </div>

  <!-- Dashboard -->
  <nav class="navbar">
    <h1>&#128202; Admin Dashboard</h1>
    <div>
      <button class="refresh-btn" onclick="loadData()">&#8635; Refresh</button>
      <button class="refresh-btn" onclick="doLogout()" style="margin-left:8px">Logout</button>
    </div>
  </nav>

  <div class="container">
    <div id="error-area"></div>
    <div class="summary" id="summary-cards">
      <div class="loading" id="loading">Loading dashboard...</div>
    </div>
    <div id="org-list"></div>
  </div>

  <script>
    let sessionToken = sessionStorage.getItem('admin_session_token') || '';

    // Check if already logged in
    if (sessionToken) {
      document.getElementById('login-overlay').style.display = 'none';
      loadData();
    }

    async function doLogin() {
      const input = document.getElementById('password-input');
      const password = input.value.trim();
      if (!password) { document.getElementById('login-error').textContent = 'Please enter a password'; return; }
      document.getElementById('login-error').textContent = '';
      try {
        const r = await fetch('/admin-dashboard/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password })
        });
        const j = await r.json();
        if (!j.success) {
          document.getElementById('login-error').textContent = j.error || 'Login failed';
          return;
        }
        sessionToken = j.token;
        sessionStorage.setItem('admin_session_token', sessionToken);
        document.getElementById('login-overlay').style.display = 'none';
        loadData();
      } catch (e) {
        document.getElementById('login-error').textContent = 'Connection error';
      }
    }

    function doLogout() {
      sessionStorage.removeItem('admin_session_token');
      sessionToken = '';
      location.reload();
    }

    // Enter key on input
    document.getElementById('password-input').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });

    async function loadData() {
      document.getElementById('error-area').innerHTML = '';
      try {
        const r = await fetch('/admin-dashboard/api/stats', {
          headers: { 'Authorization': 'Bearer ' + sessionToken }
        });
        if (r.status === 401) {
          sessionStorage.removeItem('admin_session_token');
          sessionToken = '';
          document.getElementById('login-overlay').style.display = 'flex';
          document.getElementById('login-error').textContent = 'Session expired. Please log in again.';
          return;
        }
        const j = await r.json();
        if (!j.success) throw new Error(j.error);
        render(j);
      } catch (e) {
        document.getElementById('error-area').innerHTML = '<div class="error-banner">' + esc(e.message) + '</div>';
      }
    }

    function render(data) {
      const s = data.summary;
      document.getElementById('summary-cards').innerHTML = `
        <div class="card"><div class="label">Organizations</div><div class="value blue">${s.totalOrganizations}</div></div>
        <div class="card"><div class="label">Total Users</div><div class="value blue">${s.totalUsers}</div></div>
        <div class="card"><div class="label">Desktop Installed</div><div class="value green">${s.desktopInstalled}</div></div>
        <div class="card"><div class="label">Not Installed</div><div class="value orange">${s.desktopNotInstalled}</div></div>
        <div class="card"><div class="label">Active Now</div><div class="value purple">${s.activeNow}</div></div>
      `;

      const list = document.getElementById('org-list');
      if (!data.organizations || data.organizations.length === 0) {
        list.innerHTML = '<div class="loading">No organizations found</div>';
        return;
      }

      list.innerHTML = data.organizations.map((org, i) => `
        <div class="org-section">
          <div class="org-header" onclick="toggleOrg(${i})">
            <div>
              <span class="org-name">${esc(org.name)}</span>
            </div>
            <div class="org-badges">
              <span class="badge badge-blue">${org.totalUsers} users</span>
              <span class="badge badge-green">${org.installedDesktop} installed</span>
              <span class="badge badge-orange">${org.notInstalled} not installed</span>
              <span class="badge badge-purple">${org.activeNow} active</span>
              <span class="badge badge-gray">${org.tier}</span>
              <span class="chevron" id="chev-${i}">&#9654;</span>
            </div>
          </div>
          <div class="org-body" id="org-body-${i}">
            <table>
              <thead><tr>
                <th>User</th><th>Email</th><th>Desktop</th><th>Status</th><th>Last Heartbeat</th><th>Version</th><th>Joined</th>
              </tr></thead>
              <tbody>
                ${org.users.length === 0 ? '<tr><td colspan="7" style="text-align:center;color:#b2bec3;padding:20px">No users</td></tr>' :
                  org.users.map(u => `<tr>
                    <td>${esc(u.displayName || '—')}</td>
                    <td>${esc(u.email || '—')}</td>
                    <td>${u.desktopInstalled
                      ? '<span class="dot dot-green"></span>Installed'
                      : '<span class="dot dot-gray"></span>Not Installed'}</td>
                    <td>${u.desktopLoggedIn
                      ? '<span class="dot dot-green"></span>Logged In'
                      : '<span class="dot dot-orange"></span>Logged Out'}</td>
                    <td class="time-ago">${u.lastHeartbeat ? timeAgo(u.lastHeartbeat) : '—'}</td>
                    <td>${esc(u.appVersion || '—')}</td>
                    <td class="time-ago">${u.createdAt ? new Date(u.createdAt).toLocaleDateString() : '—'}</td>
                  </tr>`).join('')}
              </tbody>
            </table>
          </div>
        </div>
      `).join('');
    }

    function toggleOrg(i) {
      const body = document.getElementById('org-body-' + i);
      const chev = document.getElementById('chev-' + i);
      body.classList.toggle('open');
      chev.classList.toggle('open');
    }

    function timeAgo(ts) {
      const diff = Date.now() - new Date(ts).getTime();
      if (diff < 60000) return 'Just now';
      if (diff < 3600000) return Math.floor(diff / 60000) + 'm ago';
      if (diff < 86400000) return Math.floor(diff / 3600000) + 'h ago';
      return Math.floor(diff / 86400000) + 'd ago';
    }

    function esc(s) {
      if (s == null) return '';
      const d = document.createElement('div');
      d.textContent = s;
      return d.innerHTML;
    }

    // Auto-refresh every 30 seconds
    setInterval(() => { if (sessionToken) loadData(); }, 30000);
  </script>
</body>
</html>
