<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/jpeg" href="/amzur-logo.jpg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MyWorkMate</title>
    <script>
      // Apply the saved theme before first paint so dark mode survives a
      // reload without a flash of the light theme.
      if (localStorage.getItem('darkMode') === 'true') {
        document.documentElement.classList.add('dark');
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
