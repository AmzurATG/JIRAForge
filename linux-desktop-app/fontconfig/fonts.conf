<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  Fontconfig for the frozen TimeTracker process only (see launcher.install_fontconfig).
  The bundled libXft predates colour glyph support; handing it a colour emoji font
  makes Xwayland reject RenderAddGlyphs with BadLength, and Xlib's default error
  handler then exits the whole app. Emoji in Tk windows render as missing glyphs instead.
-->
<fontconfig>
  <include ignore_missing="yes">/etc/fonts/fonts.conf</include>
  <selectfont>
    <rejectfont>
      <!-- Colour bitmap fonts (CBDT/sbix): the bundled fontconfig leaves "color" unset for them. -->
      <pattern>
        <patelt name="outline"><bool>false</bool></patelt>
        <patelt name="scalable"><bool>true</bool></patelt>
      </pattern>
      <pattern>
        <patelt name="color"><bool>true</bool></patelt>
      </pattern>
      <glob>*NotoColorEmoji*</glob>
      <glob>*Twemoji*</glob>
      <glob>*JoyPixels*</glob>
      <glob>*EmojiOne*</glob>
      <glob>*AppleColorEmoji*</glob>
    </rejectfont>
  </selectfont>
</fontconfig>
