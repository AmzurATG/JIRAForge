app:
  id: ari:cloud:ecosystem::app/c8bab1dc-ae32-4e6f-9dbd-eb242cc6c14a
  runtime:
    name: nodejs20.x

remotes:
  - key: ai-server
    baseUrl: https://forgesync.amzur.com
    operations:
      - compute

modules:
  function:
    - key: main
      handler: index.handler
    - key: scheduledWorklogSync
      handler: index.scheduledWorklogSyncHandler
      timeoutSeconds: 900
    - key: issueCacheSync
      handler: index.issueCacheSyncHandler
      timeoutSeconds: 25

  jira:projectPage:
    - key: brd-time-tracker-project-page
      resource: main
      resolver:
        function: main
      title: Time Tracker

  jira:issuePanel:
    - key: brd-time-tracker-issue-panel
      resource: main
      resolver:
        function: main
      title: Time Analytics
      icon: https://developer.atlassian.com/platform/forge/images/issue-panel-icon.svg

  jira:adminPage:
    - key: brd-time-tracker-settings
      title: Time Tracker Settings
      resource: settings
      resolver:
        function: main

  scheduledTrigger:
    - key: worklog-sync-trigger
      function: scheduledWorklogSync
      interval: hour

  trigger:
    - key: issue-cache-trigger
      function: issueCacheSync
      events:
        - avi:jira:updated:issue

resources:
  - key: main
    path: static/main/build
  - key: settings
    path: static/settings/build

permissions:
  scopes:
    read:me: {}
    read:jira-work:
      allowImpersonation: true
    write:jira-work:
      allowImpersonation: true
    read:jira-user:
      allowImpersonation: true
    storage:app: {}
  external:
    fetch:
      backend:
        - address: "*.supabase.co"
    images:
      - address: "*.supabase.co"
