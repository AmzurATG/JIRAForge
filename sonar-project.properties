# SonarCloud Project Configuration

sonar.projectKey=JIRAForge
sonar.organization=AmzurATG

# Project metadata
sonar.projectName=JIRAForge
sonar.projectVersion=1.0

# Source code directories
sonar.sources=ai-server/src,forge-app/src

# Test directories
sonar.tests=ai-server/tests

# Exclusions - don't analyze these
sonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/*.test.js,**/*.spec.js,**/coverage/**,**/venv/**,**/__pycache__/**,**/tests/**, **/docs/**, **/images/**

# JavaScript/TypeScript specific settings
sonar.javascript.lcov.reportPaths=ai-server/coverage/lcov.info

# Encoding
sonar.sourceEncoding=UTF-8

# Pull Request Configuration
sonar.pullrequest.provider=github
sonar.pullrequest.github.repository=AmzurATG/JIRAForge

# Quality Gate - Adjust coverage requirements
# Set to false to not fail on quality gate (temporary during initial setup)
sonar.qualitygate.wait=false

# Coverage threshold for new code (Optional - can override in SonarCloud UI)
# sonar.coverage.exclusions=**/*.test.js,**/*.spec.js

# New Code Definition
sonar.newCode.referenceBranch=main
